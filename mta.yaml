_schema-version: 3.3.0
ID: RiskManagement
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: RiskManagement-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: RiskManagement-db
      - name: RiskManagement-destination
      - name: RiskManagement-auth

  - name: RiskManagement-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: RiskManagement-db

  - name: RiskManagement-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: RiskManagementrisks
          artifacts:
            - risks.zip
          target-path: app/
    requires:
      - name: RiskManagement-auth
      - name: srv-api
      - name: RiskManagement-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: RiskManagementrisks
    type: html5
    path: app/risks
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: RiskManagement-destinations
    type: com.sap.application.content
    requires:
      - name: RiskManagement-auth
        parameters:
          service-key:
            name: RiskManagement-auth-key
      - name: RiskManagement-html5-repo-host
        parameters:
          service-key:
            name: RiskManagement-html5-repo-host-key
      - name: srv-api
      - name: RiskManagement-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: RiskManagement-html5-repository
              ServiceInstanceName: RiskManagement-html5-repo-host
              ServiceKeyName: RiskManagement-html5-repo-host-key
              sap.cloud.service: RiskManagement.service
            - Name: RiskManagement-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: RiskManagement-auth
              ServiceKeyName: RiskManagement-auth-key
              sap.cloud.service: RiskManagement.service

resources:
  - name: RiskManagement-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: RiskManagement-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                ForwardAuthToken: true
                DynamicDestination: true
    requires:
      - name: srv-api
  - name: RiskManagement-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: RiskManagement-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'RiskViewer (RiskManagement ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.RiskViewer'
          - name: 'RiskManager (RiskManagement ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.RiskManager'

  - name: RiskManagement-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
